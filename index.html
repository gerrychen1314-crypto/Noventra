<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noventra</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f8f8f8;
    color:#222;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:white;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav a{
    margin-left:25px;
    text-decoration:none;
    color:#222;
    font-weight:600;
}

.hero{
    text-align:center;
    padding:100px 20px;
}

.hero h1{
    font-size:56px;
    margin-bottom:20px;
}

.hero p{
    font-size:20px;
    color:#666;
    margin-bottom:35px;
}

.button{
    display:inline-block;
    background:black;
    color:white;
    padding:15px 35px;
    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    padding:60px 8%;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card img{
    width:100%;
    border-radius:10px;
}

.card h3{
    margin:15px 0;
}

footer{
    text-align:center;
    padding:30px;
    color:gray;
}
</style>

</head>

<body>

<header>
<div class="logo">Noventra</div>

<nav>
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>

</header>

<section class="hero">

<h1>Premium Products for Your Best Friend</h1>

<p>Modern products. Clean design. Simple shopping.</p>

<a class="button" href="#">Shop Now</a>

</section>

<section class="products">

<div class="card">
<img src="https://picsum.photos/400/300?1">
<h3>Premium Product</h3>
<p>£39.99</p>
</div>

<div class="card">
<img src="https://picsum.photos/400/300?2">
<h3>Best Seller</h3>
<p>£49.99</p>
</div>

<div class="card">
<img src="https://picsum.photos/400/300?3">
<h3>New Arrival</h3>
<p>£59.99</p>
</div>

</section>

<footer>

© 2026 Noventra. All rights reserved.

</footer>

</body>
</html>
